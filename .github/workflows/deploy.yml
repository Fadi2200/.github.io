name: Deploy Quarto Site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.5.57

      - name: Render Quarto site
        run: quarto render

      - name: Fix sitemap namespace
        run: |
          cat > docs/sitemap.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
          <url><loc>https://fadi2200.github.io/</loc></url>
          <url><loc>https://fadi2200.github.io/research.html</loc></url>
          <url><loc>https://fadi2200.github.io/publications.html</loc></url>
          <url><loc>https://fadi2200.github.io/teaching.html</loc></url>
          <url><loc>https://fadi2200.github.io/supervision.html</loc></url>
          <url><loc>https://fadi2200.github.io/service.html</loc></url>
          <url><loc>https://fadi2200.github.io/media.html</loc></url>
          <url><loc>https://fadi2200.github.io/contact.html</loc></url>
          </urlset>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
