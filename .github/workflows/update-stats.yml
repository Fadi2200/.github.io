name: Update Scholar Stats Weekly

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch Scholar stats
        run: |
          python3 << 'PYEOF'
          import requests, json, re
          from bs4 import BeautifulSoup

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
          }
          url = 'https://scholar.google.com/citations?user=5ivk5WQAAAAJ&hl=en'
          try:
              r = requests.get(url, headers=headers, timeout=15)
              soup = BeautifulSoup(r.text, 'html.parser')
              tables = soup.find_all('td', class_='gsc_rsb_std')
              citations = tables[0].text.strip() if tables else 'N/A'
              # Count publications from profile
              pub_count = len(soup.find_all('tr', class_='gsc_a_tr'))
              stats = {
                  'citations': citations,
                  'publications': str(pub_count) if pub_count > 0 else '114',
                  'updated': '2026-06-10'
              }
          except Exception as e:
              print(f'Error: {e}')
              stats = {'citations': '2020+', 'publications': '114', 'updated': 'unknown'}

          with open('assets/stats.json', 'w') as f:
              json.dump(stats, f)
          print('Stats saved:', stats)
          PYEOF

      - name: Commit stats
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/stats.json
          git diff --staged --quiet || git commit -m "chore: update scholar stats [skip ci]"
          git push
